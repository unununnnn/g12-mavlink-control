plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.register('regression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.g12.bench.ReadOnlySessionTest'
}
tasks.named('check') { dependsOn regression }
tasks.register('restartRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.g12.bench.RetainedReadBackendTest'
}
tasks.named('check') { dependsOn restartRegression }
