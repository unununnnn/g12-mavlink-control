name: Verify simulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Offline core regression
        run: bash scripts/test.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check preinstalled Android tools (never auto-accept SDK licenses)
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Build and lint simulation APK
        run: gradle --no-daemon :core:check :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: g12-simulation-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            artifacts/vectors.json
          if-no-files-found: error
          retention-days: 14
