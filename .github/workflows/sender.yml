name: Build G12 serial capture sender APK
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  sender:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify existing Android tools, fetch official fixed SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          bash scripts/fetch_skydroid.sh
      - name: Install pinned PC-decoder test dependencies on disposable runner
        run: python -m pip install -r lab/serial-requirements.txt
      - name: Protocol, input lifecycle, sender failure and independent serial oracle tests
        run: |
          mkdir -p artifacts/sender
          bash scripts/test.sh | tee artifacts/sender/java-tests.txt
          python -m unittest lab.test_serial_echo lab.test_arbiter -v 2>&1 | tee artifacts/sender/python-tests.txt
      - name: Build and lint sender and preserved readonly app
        run: gradle --no-daemon -PwithSkydroid=true :sender-core:check :sender:assembleDebug :sender:lintDebug :bench:assembleDebug :bench:lintDebug
      - name: Inspect actual sender and preserve readonly boundary
        run: |
          cp sender/build/outputs/apk/debug/sender-debug.apk artifacts/sender/g12-serial-bench-0.3.1.apk
          python scripts/verify_sender.py artifacts/sender/g12-serial-bench-0.3.1.apk vendor/rcsdk-v1.9.2.aar
          mkdir -p artifacts/bench
          cp bench/build/outputs/apk/debug/bench-debug.apk artifacts/bench/g12-sdk-readonly-0.2.1.apk
          python scripts/verify_bench.py artifacts/bench/g12-sdk-readonly-0.2.1.apk vendor/rcsdk-v1.9.2.aar
          cp docs/RESTART_FIX.md artifacts/sender/
          cp lab/serial_echo.py lab/serial-requirements.txt docs/SERIAL_BENCH.md artifacts/sender/
          cp artifacts/sender-vectors.json artifacts/sender/
      - uses: actions/upload-artifact@v4
        with:
          name: g12-serial-bench-android13
          path: |
            artifacts/sender/
            artifacts/bench/
            sender/build/reports/lint-results-debug.html
            sender/build/reports/lint-results-debug.xml
          if-no-files-found: error
          retention-days: 30
