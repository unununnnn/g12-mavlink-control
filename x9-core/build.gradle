plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.register('regression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.g12.x9core.DirectTests'
}
tasks.named('check') { dependsOn regression }
tasks.register('channelRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.g12.x9core.ChannelTests'
}
tasks.named('check') { dependsOn channelRegression }
